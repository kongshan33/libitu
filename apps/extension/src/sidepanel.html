<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Libitu</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <main class="panel">
      <header class="header">
        <div>
          <p class="eyebrow">Libitu</p>
          <h1>Stage 1</h1>
        </div>
        <button id="refresh" class="icon-button" type="button" title="Refresh page state" aria-label="Refresh page state">
          <span aria-hidden="true">R</span>
        </button>
      </header>

      <section id="state" class="state" role="status">
        <span class="indicator loading" aria-hidden="true"></span>
        <p>Reading the current YouTube page.</p>
      </section>

      <section class="video">
        <p class="label">Current video</p>
        <h2 id="title">Waiting for YouTube</h2>
        <p id="url" class="url"></p>
      </section>

      <section class="transcript">
        <div>
          <p class="label">Transcript</p>
          <p id="transcript-status">Checking available captions.</p>
        </div>
        <textarea id="transcript" rows="7" placeholder="No captions found. Paste a transcript here to continue."></textarea>
      </section>

      <footer class="actions">
        <button id="start" class="primary-button" type="button" disabled>Start blueprint</button>
      </footer>
    </main>
    <script src="sidepanel.js"></script>
  </body>
</html>
