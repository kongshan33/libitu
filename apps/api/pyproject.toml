[project]
name = "libitu-api"
version = "0.1.0"
description = "FastAPI backend for Libitu content processing, corpus, and speaking practice."
requires-python = ">=3.11,<3.15"
dependencies = [
  "certifi>=2024.7.4",
  "clerk-backend-api>=6.0.1",
  "en-core-web-sm==3.8.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sherpa-onnx>=1.13.6,<2",
  "sherpa-onnx-core>=1.13.6,<2",
  "spacy==3.8.16",
  "upstash-redis>=1.5.0",
  "uvicorn[standard]>=0.30.0",
  "websockets>=15,<18",
  "youtube-transcript-api>=1.2.4,<2",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[project.optional-dependencies]
acoustics = [
  "numpy==2.2.6",
  "praat-parselmouth==0.4.7",
  "onnxruntime==1.22.1",
  "faster-whisper==1.2.1",
]
dev = [
  "pytest>=8.2.0",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
