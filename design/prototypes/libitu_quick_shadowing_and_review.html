<script>
/* ---------- data (sentences 14, 17, 18 are from the page; the rest is placeholder text) ---------- */
const FW=new Set(['i','we','the','a','in','and','that','to','it','of','so','as','you','these','are','were','than','too','us','up','also']);
const clean=w=>w.toLowerCase().replace(/[^a-z]/g,'');
const A=(s,heard,extra)=>({st:s,heard:heard||{},extra:extra||{}});
const SEN=[
 {id:11,ts:'~20:42',text:'We tested the idea in a simple environment first.',ref:true,badges:{3:['lk',1],4:['wk',1],5:['wk',1]},over:null,sc:[80,88,72],out:[A('mmmmmmmmm')]},
 {id:12,ts:'~20:49',text:'And the results were better than we expected.',ref:true,badges:{1:['wk',1],3:['wk',1],4:['ft',0],5:['wk',1]},over:null,sc:[71,84,66],out:[A('mmmmmmxw',{7:'accepted'}),A('mmmmmmmm')]},
 {id:13,ts:'~20:55',text:'That gave us the confidence to scale it up.',ref:false,badges:{3:['wk',1],5:['wk',1],7:['lk',1]},over:null,sc:[69,80,63],out:[A('mxxmwxwxm',{4:'confident',6:'skill'}),A('mxmmwmmmm',{4:'confident'})]},
 {id:14,ts:'~21:13',text:'So these are real examples and and as you know Martin Andrew too cars are the simplest kind of robots.',ref:true,badges:{5:['wk',1],6:['wk',0],7:['lk',1],14:['lk',1],18:['wk',1]},over:8,sc:[74,80,68],out:[A('mmmmmmmmmmwmmmmmmxmm',{10:'marketing'})]},
 {id:17,ts:'~21:21',text:'So so clearly simulation plays a huge role in robotic learning.',ref:true,badges:{4:['lk',1],5:['wk',1],7:['lk',1],8:['wk',1],9:['ft',0]},over:1,sc:[71,86,69],out:[A('mmxwmmmmmmm',{3:'stimulation'},{1:'uh'}),A('mmmmmmmmmmm')]},
 {id:18,ts:'~21:26',text:'I also want to add to that.',ref:false,badges:{3:['lk',1],5:['wk',1],6:['wk',1]},over:null,sc:[82,88,74],out:[A('mmmmmmm')]}
];
const ALL=SEN.map(s=>s.id);
const sen=id=>SEN.find(s=>s.id===id);
const W=X=>X.text.split(' ');
const pctOf=st=>Math.round(st.filter(x=>x==='m').length/st.length*100);
const tierOf=p=>p>=85?'full':p>=60?'partial':'none';
const TIMES=['9:12 PM','9:13 PM','9:15 PM','9:16 PM','9:18 PM','9:19 PM','9:21 PM','9:22 PM','9:24 PM'];
const HID=['Hidden','Key words','Full'];

/* ---------- state ---------- */
let view='quick',phase='idle',round=1,queue=[],qi=0,roundStart={},skipped={};
let pStart=0,pDur=0,pElapsed=0,pausedFrom=null;
let R={};                       /* id -> {takes:[], shown, ana} */
let mic='ask',micPrompt=false,micThen=null;
let spd=1,turnMul=1.15,autoAdv=true,tl=0,pop=null;
let rvId=null,rvT=null,rvTab='sound',rvSide=true,rvFilter='all',tt=null,tcount=0;
const rev=new Set();

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2200)}
const lastTake=id=>{const r=R[id];return r&&r.takes[r.takes.length-1]};
const tierIcon={full:'✓',partial:'◐',none:'○'};

/* ---------- take simulation ---------- */
function addTake(id,instant){
  const X=sen(id);const r=R[id]||(R[id]={takes:[],shown:false,ana:false});
  const o=X.out[Math.min(r.takes.length,X.out.length-1)];
  const st=o.st.split('');const p=pctOf(st);
  r.takes.push({st,heard:o.heard,extra:o.extra,tier:tierOf(p),pct:p,time:TIMES[tcount++%TIMES.length]});
  r.shown=!!instant;r.ana=!!instant;
  if(!instant){
    setTimeout(()=>{r.shown=true;if(view==='quick')renderStrip()},1100);
    setTimeout(()=>{r.ana=true;if(view==='review'||phase==='done')renderAll()},3600);
  }
}

/* ---------- browser bar + mic ---------- */
function renderBar(){
  const bub=micPrompt?`<div class="bubble"><div class="bt1">libitu.app wants to</div><div class="bt2">🎙 Use your microphone</div><div class="bb"><button class="bt sm" onclick="micAnswer(false)">Block</button><button class="bt p sm" onclick="micAnswer(true)">Allow while visiting</button></div></div>`:'';
  document.getElementById('bar').innerHTML=`<div class="tbr"><div class="tdots"><i></i><i></i><i></i></div><div class="url">🔒 libitu.app/shadow/fei-fei-li</div></div>${bub}`;
}
function ensureMic(cb){
  if(mic==='on'){cb();return}
  if(mic==='blocked'){toast('Microphone is blocked. Allow it from the address bar to record.');return}
  micPrompt=true;micThen=cb;renderBar();
}
function micAnswer(ok){
  micPrompt=false;mic=ok?'on':'blocked';syncDemo();renderBar();
  const cb=micThen;micThen=null;
  if(ok&&cb)cb();else toast('Microphone is blocked. Allow it from the address bar to record.');
}

/* ---------- mode tabs ---------- */
function renderMode(){
  const has=Object.keys(R).length>0;
  document.getElementById('mode').innerHTML=
    `<div class="${view==='quick'?'on':''}" onclick="goQuick()">Quick</div>`+
    `<div onclick="toast('Opens the step-by-step view from the previous prototype')">Detailed</div>`+
    `<div class="${view==='review'?'on':''}" onclick="goReview()">Review${has?'<span class="dotn"></span>':''}</div>`;
}
function goQuick(){view='quick';pop=null;renderAll()}
function goReview(){
  if(['listen','turn','gap','wait'].includes(phase))pause();
  view='review';pop=null;
  const ids=ALL.filter(id=>R[id]);
  if(!rvId||!R[rvId])rvId=ids[0]||null;
  rvT=null;rvTab='sound';
  renderAll();
}

/* ---------- quick: shared ---------- */
function seg(opts,cur,fn){return `<div class="seg">${opts.map(o=>`<div class="${o[0]===cur?'on':''}" onclick="${fn}(${typeof o[0]==='string'?`'${o[0]}'`:o[0]})">${o[1]}</div>`).join('')}</div>`}
function setSpd(v){spd=v;renderQuick()}
function setTurn(v){turnMul=v;renderQuick()}
function setAuto(v){autoAdv=(v==='on');renderQuick()}
function setTl(v){tl=v;rev.clear();renderQuick()}
function togglePop(n){pop=pop===n?null:n;renderQuick()}

function stripHTML(){
  const segs=queue.map((id,i)=>{
    const r=R[id];const doneThis=r&&r.takes.length>(roundStart[id]||0);
    let c='pend';
    if(skipped[id]&&i<qi)c='skip';
    else if(doneThis)c=r.shown?lastTake(id).tier:'chk';
    else if(i===qi&&['listen','turn','paused','wait','gap'].includes(phase))c='cur';
    return `<div class="sg ${c}"></div>`;
  }).join('');
  const lab=phase==='done'?`Round ${round} complete`:`Round ${round} · Sentence ${Math.min(qi+1,queue.length)} of ${queue.length}`;
  return `<div id="strip"><div class="strip2">${segs}</div><div class="sl"><span>${lab}</span><span>${phase==='done'?'':'No scoring while you practice'}</span></div></div>`;
}
function renderStrip(){const e=document.getElementById('strip');if(e)e.outerHTML=stripHTML()}

/* ---------- quick: start screen ---------- */
function startHTML(){
  const nref=ALL.filter(id=>sen(id).ref).length;
  return `<div class="st">
    <div><div class="st-t">Quick shadowing</div><div class="st-d" style="margin-top:6px">Listen to each sentence, then say it right away. Nothing is analyzed on screen while you practice. The details are waiting in Review.</div></div>
    <div class="cardp">
      <div class="row2"><div class="k">This run</div><div class="v">Sentences 11–18 · ${ALL.length} to practice <small>· 2 very short ones skipped · about 1 minute</small></div><span class="lnk" onclick="toast('Pick a different range of sentences')">Change</span></div>
      <div class="row2"><div class="k">Reference audio</div><div class="v">Ready for ${nref} of ${ALL.length} <small>· the other ${ALL.length-nref} play from the video</small></div><span class="lnk" onclick="toast('Opens the segment page, where the rest can be prepared')">Prepare the rest</span></div>
      <div class="row2"><div class="k">Speed</div><div class="v">${seg([[0.75,'0.75×'],[1,'1×'],[1.25,'1.25×']],spd,'setSpd')}</div></div>
      <div class="row2"><div class="k">Time to repeat</div><div class="v">${seg([[1.15,'Normal'],[1.6,'Longer']],turnMul,'setTurn')}</div></div>
      <div class="row2"><div class="k">Text</div><div class="v">${seg([[0,'Hidden'],[1,'Key words'],[2,'Full']],tl,'setTl')}</div></div>
      <div class="row2"><div class="k">After each sentence</div><div class="v">${seg([['on','Go on by itself'],['off','Wait for me']],autoAdv?'on':'off','setAuto')}</div></div>
    </div>
    <div class="cta"><button class="bt p big" onclick="startRun()">▶ Start</button><div class="hint" style="text-align:left">The microphone opens by itself after each sentence. You can pause any time.</div></div>
  </div>`;
}

/* ---------- quick: running ---------- */
function curX(){return sen(queue[qi])}
function listenMs(X){return Math.min(5200,Math.round((1300+W(X).length*190)/spd))}
function durFor(ph){
  const X=curX();
  if(ph==='listen')return listenMs(X);
  if(ph==='turn')return Math.round(listenMs(X)*turnMul+900);
  return 650;
}
function hideX(X,i){
  if(tl===2)return false;
  if(tl===1)return FW.has(clean(W(X)[i]))&&!rev.has(i);
  return !rev.has(i);
}
function blocksHTML(X){
  return `<div class="fx-text">${W(X).map((w,i)=>hideX(X,i)?`<span class="blk" data-i="${i}" style="width:${w.length*14+14}px" onclick="peekQ(${i})"></span>`:`<span class="wd ${rev.has(i)?'pk':''}" data-i="${i}">${w}</span>`).join('')}</div>`;
}
function peekQ(i){rev.add(i);renderQuick()}
function runHTML(){
  const X=curX();const ph=phase;
  const shown=ph==='paused'?pausedFrom:ph;
  let pill=shown==='listen'?`<span class="pill listen">LISTEN</span>`:shown==='turn'?`<span class="pill turn">YOUR TURN</span>`:`<span class="pill ok">✓ SAVED</span>`;
  if(ph==='paused')pill=`<span class="pill pz">PAUSED</span>`;
  const dim=(shown==='turn')?'dim':'';
  const player=X.ref
    ?`<div class="vbar"><span class="dot"></span>Playing reference audio · video stays hidden</div>`
    :`<div class="vbox ${dim}"><div>${shown==='listen'&&ph!=='paused'?'❚❚':'▶'}</div><div class="vt" id="vtime">Playing from the video</div><div class="vprog"><i id="vfill"></i></div></div>`;
  const drain=shown==='turn'?'drain':'';
  let live='',hint='',acts='';
  if(shown==='turn'&&ph!=='paused')live=`<div class="live">${Array.from({length:16},(_,i)=>`<i style="animation-delay:${(i*0.06).toFixed(2)}s"></i>`).join('')}</div>`;
  if(ph==='listen')hint='Listen. The blocks follow the audio.';
  else if(ph==='turn')hint='Say it now. Skipping words is fine. It stops by itself when you pause.';
  else if(ph==='paused')hint='Paused. Nothing is lost.';
  else if(ph==='wait')hint='Saved. Go on when you are ready.';
  const settings=`<span class="setw"><span class="tlb" onclick="togglePop('set')">⚙ ${spd}×</span>${pop==='set'?`<div class="pop"><div class="pt">Speed</div>${seg([[0.75,'0.75×'],[1,'1×'],[1.25,'1.25×']],spd,'setSpd')}<div class="pt">Time to repeat</div>${seg([[1.15,'Normal'],[1.6,'Longer']],turnMul,'setTurn')}<div class="pt">Text</div>${seg([[0,'Hidden'],[1,'Key words'],[2,'Full']],tl,'setTl')}<div class="pt">After each sentence</div>${seg([['on','Go on by itself'],['off','Wait for me']],autoAdv?'on':'off','setAuto')}</div>`:''}</span>`;
  if(ph==='listen')acts=`<button class="bt" onclick="pause()">⏸ Pause</button><button class="bt" onclick="redo()">↻ Redo</button><button class="bt" onclick="skip()">Skip →</button>${settings}`;
  else if(ph==='turn')acts=`<button class="bt p big" onclick="finishTurn()">✓ Done</button><button class="bt" onclick="pause()">⏸ Pause</button><button class="bt" onclick="redo()">↻ Redo</button>`;
  else if(ph==='gap')acts=`<button class="bt dis">Next…</button>`;
  else if(ph==='wait')acts=`<button class="bt p big" onclick="advance()">Next sentence →</button><button class="bt" onclick="redo()">↻ Redo</button>`;
  else acts=`<button class="bt p big" onclick="resume()">▶ Resume</button><button class="bt" onclick="redo()">↻ Redo</button><button class="bt" onclick="endRun()">End run</button>`;
  const p0=ph==='paused'?Math.min(1,pElapsed/pDur):0;
  return stripHTML()+`<div class="nowp"><span>Sentence ${qi+1} of ${queue.length}</span><span>Text appears in Review</span></div>${player}
  <div class="fxr">${pill}${blocksHTML(X)}<div class="pbar ${drain}"><i id="pbar" style="width:${(drain?1-p0:p0)*100}%"></i></div>${live}<div class="hint">${hint}</div><div class="acts">${acts}</div></div>`;
}

/* ---------- quick: done ---------- */
function doneHTML(){
  const tiers=queue.map(id=>lastTake(id)?lastTake(id).tier:null);
  const g=tiers.filter(t=>t==='full').length,a=tiers.filter(t=>t==='partial').length,r=tiers.filter(t=>t==='none').length;
  const need=a+r;
  const ready=queue.filter(id=>R[id]&&R[id].ana).length;
  const anaTxt=ready<queue.length?`<span class="spin"></span>Analyzing sound, rhythm and melody · ${ready} of ${queue.length} ready`:`✓ Sound, rhythm and melody are ready in Review`;
  const prim=need>0?`<button class="bt p big" onclick="practiceNeed()">Practice the ${need} that need work</button>`:`<button class="bt p big" onclick="startRun()">Run again</button>`;
  return stripHTML()+`<div class="sum"><div class="sum-t">${round===1?'Round 1 done':'Round '+round+' done'}</div>
    <div class="sum-c"><div class="sc g"><b>${g}</b><span>matched</span></div><div class="sc a"><b>${a}</b><span>close</span></div><div class="sc r"><b>${r}</b><span>to redo</span></div></div>
    <div class="sum-n">${anaTxt}</div>
    <div class="acts">${prim}<button class="bt big" onclick="goReview()">Review details</button></div>
    <span class="lnk" onclick="toast('Back to the segment list')">Back to segments</span></div>`;
}

function renderQuick(){
  const m=document.getElementById('main');
  let h;
  if(phase==='idle')h=startHTML();
  else if(phase==='done')h=doneHTML();
  else h=runHTML();
  m.innerHTML=`<div class="inner">${h}</div>`;
  updateProgress();
}

/* ---------- quick: engine ---------- */
function startRun(){ensureMic(()=>beginRun(ALL,1))}
function beginRun(ids,rd){
  queue=ids.slice();qi=0;round=rd;skipped={};rev.clear();pop=null;
  roundStart={};ids.forEach(id=>roundStart[id]=R[id]?R[id].takes.length:0);
  view='quick';setPhase('listen');
}
function setPhase(ph){phase=ph;pStart=performance.now();pDur=durFor(ph);renderAll()}
function pause(){
  if(!['listen','turn','gap','wait'].includes(phase))return;
  if(phase==='wait')return;
  pausedFrom=phase;pElapsed=performance.now()-pStart;phase='paused';renderAll();
}
function resume(){if(phase!=='paused')return;phase=pausedFrom;pStart=performance.now()-pElapsed;renderAll()}
function redo(){rev.clear();setPhase('listen')}
function skip(){skipped[queue[qi]]=true;advance(true)}
function finishTurn(){
  if(phase!=='turn')return;
  addTake(queue[qi],false);
  if(autoAdv)setPhase('gap');else{phase='wait';renderAll()}
}
function advance(){
  rev.clear();qi++;
  if(qi>=queue.length){phase='done';renderAll()}else setPhase('listen');
}
function endRun(){phase='done';qi=queue.length;renderAll()}
function practiceNeed(){
  const ids=queue.filter(id=>{const t=lastTake(id);return t&&t.tier!=='full'});
  ensureMic(()=>beginRun(ids,round+1));
}
function updateProgress(){
  if(!['listen','turn','gap'].includes(phase)&&phase!=='paused')return;
  const ph=phase==='paused'?pausedFrom:phase;
  const p=phase==='paused'?Math.min(1,pElapsed/pDur):Math.min(1,(performance.now()-pStart)/pDur);
  const b=document.getElementById('pbar');if(b)b.style.width=((ph==='turn'?1-p:p)*100)+'%';
  const v=document.getElementById('vfill');if(v)v.style.width=(ph==='listen'?p*100:0)+'%';
  if(ph==='listen'){
    const X=curX();const n=W(X).length;const idx=Math.min(n-1,Math.floor(p*n));
    document.querySelectorAll('#main [data-i]').forEach(e=>e.classList.toggle('lit',+e.dataset.i===idx&&phase!=='paused'));
  } else document.querySelectorAll('#main .lit').forEach(e=>e.classList.remove('lit'));
}
function tick(){
  if(view!=='quick'||!['listen','turn','gap'].includes(phase))return;
  updateProgress();
  if(performance.now()-pStart>=pDur){
    if(phase==='listen')setPhase('turn');
    else if(phase==='turn')finishTurn();
    else if(phase==='gap')advance();
  }
}
setInterval(tick,50);

/* ---------- review ---------- */
function reviewIds(){return ALL.filter(id=>R[id])}
function filteredIds(){
  return reviewIds().filter(id=>{const t=lastTake(id).tier;return rvFilter==='all'||(rvFilter==='need'?t!=='full':t==='full')});
}
function heatOf(t){return `<div class="heat">${t.st.map(x=>`<i class="${x}"></i>`).join('')}</div>`}
function renderRvSide(){
  const el=document.getElementById('side');
  const ids=filteredIds();
  if(!rvSide){
    el.innerHTML=`<div class="rail"><button class="sd-tg" onclick="rvSide=true;renderAll()" title="Show list">»</button><div class="rail-l">${reviewIds().map(id=>`<div class="rd ${lastTake(id).tier} ${id===rvId?'cur':''}" onclick="selRv(${id})">${id}</div>`).join('')}</div></div>`;
    return;
  }
  const chips=[['all','All'],['need','Needs work'],['ok','Matched']].map(c=>`<div class="fch ${rvFilter===c[0]?'on':''}" onclick="rvFilter='${c[0]}';renderAll()">${c[1]}</div>`).join('');
  const items=ids.map(id=>{
    const X=sen(id),r=R[id],t=lastTake(id);
    return `<div class="rvi ${id===rvId?'cur':''}" onclick="selRv(${id})"><div class="rvi-top"><span class="rvi-n">${id}</span><span class="rvi-ts">${X.ts}</span><span class="rvi-i" style="color:${{full:'#1D9E75',partial:'#BA7517',none:'#E24B4A'}[t.tier]}">${tierIcon[t.tier]}</span></div><div class="rvi-t">${X.text}</div>${heatOf(t)}<div class="rvi-s"><span class="ad ${r.ana?'':'pn'}"></span>${r.ana?'analysis ready':'analyzing…'} · ${r.takes.length} take${r.takes.length>1?'s':''}</div></div>`;
  }).join('')||`<div class="rvi-t" style="padding:14px">Nothing in this filter.</div>`;
  el.innerHTML=`<div class="sd-h"><div class="sd-row"><div class="sd-t">Practiced · ${reviewIds().length}</div><button class="sd-tg" onclick="rvSide=false;renderAll()" title="Collapse">«</button></div><div class="fchips">${chips}</div></div><div class="sd-l">${items}</div>`;
}
function selRv(id){rvId=id;rvT=null;rvTab='sound';renderAll()}

function fbList(X,T){
  const Ws=W(X),L=[];
  T.st.forEach((s,i)=>{
    if(s==='x')L.push({t:'bad',x:`"${clean(Ws[i])}" was skipped`,k:'skip'});
    if(s==='w')L.push({t:'bad',x:`"${clean(Ws[i])}" heard as "${T.heard[i]}"`,k:'diff'});
  });
  Object.entries(X.badges).forEach(([i,b])=>{
    if(T.st[i]!=='m')return;
    const lab={lk:['linked','not linked'],wk:['reduced','not reduced'],ft:['flapped','/t/ not flapped']}[b[0]];
    L.push({t:b[1]?'ok':'bad',x:`"${clean(Ws[i])}" ${b[1]?lab[0]:lab[1]}`,k:b[1]?'ok':b[0]});
  });
  if(X.over!=null&&T.st[X.over]==='m')L.push({t:'bad',x:`"${clean(Ws[X.over])}" over-stressed`,k:'over'});
  const bad=L.filter(x=>x.t==='bad'),ok=L.filter(x=>x.t==='ok').slice(0,2);
  return bad.slice(0,4).concat(ok);
}
function tipFor(L){
  const b=L.find(x=>x.t==='bad');
  if(!b)return 'Nice. Keep the rhythm even and move on.';
  return {skip:'Practice the part around the skipped word on its own, then add the rest.',diff:'Listen once more for the exact word, then repeat just that phrase.',ft:'Tap the /t/ lightly, like the d in "body".',wk:'Function words should be quick and quiet. Let the content words carry the weight.',lk:'Run the two words together as if they were one.',over:'This is a function word. Say it quickly and quietly.'}[b.k]||'';
}

function rvRefRow(X){
  const Ws=W(X);
  return `<div class="wf">${Ws.map((w,i)=>`<div class="wcd ${FW.has(clean(w))?'fn':''}"><div class="t">${w}</div><div class="bg">${X.badges[i]?`<span class="b ${X.badges[i][0]}">${{lk:'LK',wk:'WK',ft:'FT'}[X.badges[i][0]]}</span>`:''}</div></div>`).join('')}</div>`;
}
function rvUserRow(X,T){
  const Ws=W(X);
  return `<div class="wf">${Ws.map((w,i)=>{
    const s=T.st[i];
    if(s==='x')return `<div class="wcd ghost"><div class="t">${w}</div><div class="ns">skipped</div></div>`;
    if(s==='w')return `<div class="wcd diff"><div class="t">${T.heard[i]}</div><div class="ns">not scored</div></div>`;
    const b=X.badges[i],bad=b&&!b[1];
    return `<div class="wcd ${FW.has(clean(w))?'fn':''} ${bad?'bad':''}"><div class="t">${w}</div><div class="bg">${b?`<span class="b ${b[0]} ${b[1]?'':'no'}">${{lk:'LK',wk:'WK',ft:'FT'}[b[0]]} ${b[1]?'✓':'✗'}</span>`:''}</div></div>`;
  }).join('')}</div>`;
}
function rvStress(X,u){
  const Ws=W(X);
  const ref=Ws.map(w=>FW.has(clean(w))?0:2);
  const arr=ref.slice();if(u&&X.over!=null)arr[X.over]=2;
  return `<div class="srw">${Ws.map((w,i)=>`<div class="sw ${FW.has(clean(w))?'fn':''} ${u&&arr[i]!==ref[i]?'is':''}"><div class="dd"><i class="${arr[i]===2?'p':'u'}"></i></div><div class="t">${w}</div></div>`).join('')}</div>`;
}
const CURVE='<svg width="100%" height="90" viewBox="0 0 480 90" preserveAspectRatio="none" style="background:var(--color-background-secondary);border-radius:8px;margin-bottom:8px"><polyline points="0,70 40,62 80,48 120,36 160,26 200,22 240,28 280,36 320,40 360,34 400,30 440,40 480,66" fill="none" stroke="#6366F1" stroke-width="2" opacity=".45"/><polyline points="0,72 40,68 80,60 120,54 160,48 200,48 240,52 280,58 320,60 360,58 400,60 440,64 480,70" fill="none" stroke="#E24B4A" stroke-width="2"/></svg>';

function rvAnalysis(X,T,r){
  const tier=T.tier;
  let mode;               /* none | noref | pending | ok */
  if(tier==='none')mode='none';
  else if(!X.ref)mode='noref';
  else if(!r.ana)mode='pending';
  else mode='ok';
  const tabsH=[['sound','🔊 Sound',X.sc[0]],['rhythm','♩ Rhythm',X.sc[1]],['melody','〰 Melody',X.sc[2]]].map(([k,l,s])=>{
    let b,lock;
    if(mode==='none'||mode==='noref'){b='<span class="lb">🔒</span>';lock=true}
    else if(mode==='pending'){b='<span class="lb">…</span>';lock=true}
    else if(tier==='full'){b=`<span class="lb sc2">${s}</span>`;lock=false}
    else if(k==='sound'){b=`<span class="lb sc2">${s}*</span>`;lock=false}
    else{b='<span class="lb">🔒</span>';lock=true}
    return `<div class="lt ${rvTab===k&&!lock?'on':''} ${lock?'lock':''}" data-t="${k}" onclick="${lock?'':`rvTab='${k}';renderAll()`}">${l}${b}</div>`;
  }).join('');
  const fl=fbList(X,T);
  const cnt={lk:0,wk:0,ft:0};Object.values(X.badges).forEach(b=>cnt[b[0]]++);
  const cc={Linking:cnt.lk,Weak:cnt.wk,'Flap-T':cnt.ft};
  const pcs=`<div class="pcs">${['All','Linking','Weak','Flap-T','Elision','Assim.','Glottal','Drop-D','H-drop','Vowel len.','Voicing'].map((x,i)=>{const n=cc[x]||0;return `<div class="pc ${i===0?'on':''} ${i>0&&!n?'dim':''}">${x}${n?' · '+n:''}</div>`}).join('')}</div>`;
  let cont='',fb='';
  if(mode==='none')cont=`<div class="lockp"><div class="t">This take was not scored</div><div class="d">Sound, rhythm and melody are compared once the words line up. Practice this sentence again, then it will show up here.</div><button class="bt p sm" onclick="toast('Starts a quick round with this sentence')">Practice this sentence</button></div>`;
  else if(mode==='noref')cont=`<div class="lockp"><div class="t">Reference audio needed for this view</div><div class="d">Word matching works without it. To compare sound, rhythm and melody, prepare this sentence first.</div><button class="bt p sm" onclick="toast('Opens the Shadow page for this sentence to prepare it')">Prepare this sentence</button></div>`;
  else if(mode==='pending')cont=`<div class="lockp"><div class="t"><span class="spin"></span> Analyzing your take</div><div class="d">This runs in the background. You can leave this page and come back.</div></div>`;
  else if(tier==='partial'&&rvTab!=='sound')cont=`<div class="lockp"><div class="t">${rvTab==='rhythm'?'Rhythm':'Melody'} unlocks at 85%</div><div class="d">Stress, pauses and pitch can only be compared when nearly every word lines up. You are at ${T.pct}%.</div></div>`;
  else if(rvTab==='sound')cont=`${pcs}<div class="rl r">Reference</div>${rvRefRow(X)}<div class="rl u">Your voice${tier==='partial'?' · dashed words are not scored':''}</div>${rvUserRow(X,T)}`;
  else if(rvTab==='rhythm')cont=`<div class="rl r">Reference stress</div>${rvStress(X,false)}<div class="rl u">Your stress</div>${rvStress(X,true)}${X.over!=null?`<div class="nt">"${clean(W(X)[X.over])}" was over-stressed. It's a function word and should be quick and quiet.</div>`:''}`;
  else cont=`<div class="rl r">Pitch contour</div>${CURVE}<div class="nt">The main pitch fall should land on the last content word. Yours stays flatter than the reference.</div>`;
  if(mode==='ok')fb=`<div class="fb"><div class="fb-l">Feedback</div>${fl.map(x=>`<div class="fi"><div class="fic ${x.t}">${x.t==='ok'?'✓':'✗'}</div>${x.x}</div>`).join('')}<div class="tip">${tipFor(fl)}</div></div>`;
  return `<div class="card"><div class="tabs">${tabsH}</div><div class="rbody"><div class="rcont">${cont}</div>${fb}</div></div>`;
}

function renderReview(){
  const m=document.getElementById('main');
  const ids=reviewIds();
  if(!ids.length){m.innerHTML=`<div class="inner"><div class="empty"><div class="t">Nothing to review yet</div><div>Run Quick shadowing first. Your takes and their analysis will appear here.</div><div style="margin-top:14px"><button class="bt p" onclick="goQuick()">Go to Quick shadowing</button></div></div></div>`;return}
  const X=sen(rvId),r=R[rvId];
  const T=rvT!==null?r.takes[rvT]:r.takes[r.takes.length-1];
  const ti=rvT!==null?rvT:r.takes.length-1;
  const pos=ids.indexOf(rvId);
  const col={full:'#1D9E75',partial:'#EF9F27',none:'#E24B4A'}[T.tier];
  const msg=T.tier==='full'?(T.pct===100?'All words matched':`${T.pct}% of words matched`):T.tier==='partial'?`${T.pct}% of words matched · Sound scored on the matched words`:`${T.pct}% of words matched · not scored this time`;
  const diff=W(X).map((w,i)=>{const s=T.st[i];return `<span class="rw ${s}"><span class="rt">${w}</span><span class="rs">${s==='w'?'heard "'+T.heard[i]+'"':s==='x'?'skipped':''}</span></span>${T.extra[i]?`<span class="rx">+ ${T.extra[i]}</span>`:''}`}).join('');
  const takes=r.takes.length>1?`<div class="acts">${r.takes.map((t,i)=>`<div class="tkc ${i===ti?'on':''}" onclick="rvT=${i};renderAll()">Take ${i+1} · ${t.time} · ${tierIcon[t.tier]} ${t.pct}%</div>`).join('')}</div>`:'';
  m.innerHTML=`<div class="inner">
    <div class="nv"><button class="pb" onclick="stepRv(-1)">‹ Previous</button><div class="pcnt">Sentence ${rvId} · ${X.ts} · ${pos+1} of ${ids.length} practiced</div><button class="pb" onclick="stepRv(1)">Next ›</button></div>
    <div class="fxr" style="padding-top:2px"><div class="rvtext">${diff}</div><div class="stat"><i style="background:${col}"></i>${msg}</div>
      <div class="acts"><button class="bt" onclick="toast('Plays the reference${X.ref?' audio':' from the video'}')">▶ Reference</button><button class="bt" onclick="toast('Plays your take')">▶ My take</button><button class="bt p" onclick="toast('Starts a quick round with this sentence')">Practice again</button></div>${takes}</div>
    ${rvAnalysis(X,T,r)}</div>`;
}
function stepRv(d){const ids=reviewIds();const i=ids.indexOf(rvId)+d;if(i>=0&&i<ids.length){rvId=ids[i];rvT=null;rvTab='sound';renderAll()}}

/* ---------- render + demo ---------- */
function renderAll(){
  renderMode();renderBar();
  const g=document.getElementById('grid');
  if(view==='review'){g.className='grid'+(rvSide?'':' col');renderRvSide();renderReview()}
  else{g.className='grid one';document.getElementById('side').innerHTML='';renderQuick()}
}
function syncDemo(){
  document.querySelectorAll('.demo button[data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m===mic));
}
function resetAll(){phase='idle';view='quick';round=1;queue=[];qi=0;R={};roundStart={};skipped={};rev.clear();pop=null;rvId=null;rvT=null;tcount=0}
function simRound1(slow){
  ALL.forEach(id=>{roundStart[id]=0;addTake(id,true)});
  if(slow){['17','18'].forEach(k=>{R[+k].ana=false});setTimeout(()=>{R[17].ana=true;R[18].ana=true;if(phase==='done'||view==='review')renderAll()},3500)}
  queue=ALL.slice();round=1;
}
function jumpTo(k){
  phase='idle';view='quick';pop=null;
  if(k==='start'){resetAll()}
  if(k==='run'){resetAll();mic='on';syncDemo();beginRun(ALL,1);return}
  if(k==='done1'){resetAll();simRound1(true);phase='done';qi=queue.length}
  if(k==='done2'){
    resetAll();simRound1(false);
    const ids=ALL.filter(id=>lastTake(id).tier!=='full');
    queue=ids;round=2;roundStart={};ids.forEach(id=>{roundStart[id]=1;addTake(id,true)});phase='done';qi=queue.length;
  }
  if(k==='review'){resetAll();simRound1(true);phase='done';qi=queue.length;rvId=12;view='review';rvT=null;rvTab='sound'}
  renderAll();
}
document.querySelectorAll('.demo button[data-j]').forEach(b=>b.onclick=()=>jumpTo(b.dataset.j));
document.querySelectorAll('.demo button[data-m]').forEach(b=>b.onclick=()=>{mic=b.dataset.m;micPrompt=false;renderBar();syncDemo()});
syncDemo();renderAll();
</script>
</div></body></html>
