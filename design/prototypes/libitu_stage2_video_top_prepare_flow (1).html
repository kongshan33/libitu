<script>
const REF=['So','so','clearly','simulation','plays','a','huge','role','in','robotic','learning.'];
const FN=new Set([0,1,5,8]);
const ATT={
  none:{st:['m','m','x','w','m','x','w','m','x','m','x'],heard:{3:'stimulation',6:'big'},extra:{}},
  partial:{st:['m','m','x','w','m','m','m','m','m','m','m'],heard:{3:'stimulation'},extra:{1:'uh'}},
  full:{st:['m','m','m','m','m','m','m','m','m','m','m'],heard:{},extra:{}}
};
const BADGE={4:['lk',1],5:['wk',1],7:['lk',1],8:['wk',1],9:['ft',0]};
const BL={lk:'LK',wk:'WK',ft:'FT'};
const STRESS=[0,0,2,2,2,0,2,2,0,2,2];
const USTRESS=[0,2,2,2,2,0,2,2,0,2,2];
const OUT=['none','partial','full'];
const TIMES=['8:02 PM','8:05 PM','8:08 PM','8:11 PM'];
const HID=['Hidden','Key words','Full'];
const SL=[
  {n:14,ts:'~21:13',st:'done',w:20,s:7,takes:2,rf:'ready',heat:'mmmmmmmmmmwmmmmmmxmm'.split('')},
  {n:15,ts:'~21:20',st:'short',w:1,s:1,rf:'na'},
  {n:16,ts:'~21:20',st:'short',w:1,s:1,rf:'na'},
  {n:17,ts:'~21:21',st:'cur',w:11,s:5},
  {n:18,ts:'~21:26',st:'todo',w:7,s:3,rf:'none'}
];

/* state */
let S='ready',heard=false,playing=false,prog=0,tab='sound',tl=0;
let auth='off';          /* extension authorization: off | waiting | on */
let refS='none';         /* this sentence: none | preparing | analyzing | ready */
let mic='ask',micPrompt=false,micThen=null;
let pop=null,spd=1,loop=true,skipShort=true,sideOpen=true,lfOpen=false,vidForce=null;
let sel=null,takes=[],secs=0,tmr=null,tt=null,pt=null,rt=null,justRev=false;
const rev=new Set();

const mk=(id,tier,sup)=>({id,tier,time:TIMES[(id-1)%4],support:sup||'text hidden'});
const pct=t=>Math.round(ATT[t].st.filter(x=>x==='m').length/REF.length*100);
const isRes=()=>S==='none'||S==='partial'||S==='full';
const captured=()=>refS==='analyzing'||refS==='ready';
const SPEEDS=()=>captured()?[0.7,1,1.3]:[0.75,1,1.25];
const hide=i=>!isRes()&&(tl===0?!rev.has(i):tl===1?(FN.has(i)&&!rev.has(i)):false);
function showVid(){
  if(playing==='prepare')return true;
  if(playing==='listen'&&!captured())return true;
  if(vidForce!==null)return vidForce;
  if(isRes())return false;
  return !captured();
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2300)}

/* browser chrome */
function renderBar(){
  const bub=micPrompt?`<div class="bubble"><div class="bt1">libitu.app wants to</div><div class="bt2">🎙 Use your microphone</div><div class="bb"><button class="bt sm" onclick="micAnswer(false)">Block</button><button class="bt p sm" onclick="micAnswer(true)">Allow while visiting</button></div></div>`:'';
  document.getElementById('bar').innerHTML=`<div class="tbr"><div class="tdots"><i></i><i></i><i></i></div><div class="url">🔒 libitu.app/shadow/fei-fei-li</div><div class="tsp2"></div><div class="ext ${auth==='waiting'?'pulse':''} ${auth==='on'?'on':''}" onclick="extClick()" title="libitu extension">L<span class="eb"></span></div></div>${bub}`;
}
function extClick(){
  if(auth==='waiting'){auth='on';renderAll();toast('Tab audio allowed for this session')}
  else if(auth==='on')toast('libitu: tab audio is allowed for this session');
  else toast('Click Enable reference audio on the page first');
}
function ensureMic(cb){
  if(mic==='on'){cb();return}
  if(mic==='blocked'){toast('Microphone is blocked. Allow it from the address bar to record.');return}
  micPrompt=true;micThen=cb;renderBar();
}
function micAnswer(ok){
  micPrompt=false;mic=ok?'on':'blocked';syncDemo();renderBar();
  const cb=micThen;micThen=null;
  if(ok&&cb)cb();else toast('Microphone is blocked. Allow it from the address bar to record.');
}

/* words */
function wspan(i,mode){
  const w=REF[i];
  if(hide(i)){const wd=mode==='sm'?w.length*8+8:w.length*14+14;const h=mode==='sm'?'height:14px;':'';return `<span class="blk" data-i="${i}" style="width:${wd}px;${h}" onclick="peek(${i})"></span>`}
  return `<span class="wd ${rev.has(i)?'pk':''}" data-i="${i}">${REF[i]}</span>`;
}
function peek(i){rev.add(i);renderAll()}
function diffRow(){
  const a=ATT[S];let h='';
  REF.forEach((w,i)=>{
    const s=a.st[i];
    h+=`<span class="rw ${s}"><span class="rt">${w}</span><span class="rs">${s==='w'?'heard "'+a.heard[i]+'"':s==='x'?'skipped':''}</span></span>`;
    if(a.extra[i])h+=`<span class="rx">+ ${a.extra[i]}</span>`;
  });
  return h;
}

/* left panel */
function toggleSide(){sideOpen=!sideOpen;renderAll()}
function rfClass(s){
  if(s.st==='cur')return refS==='ready'?'ready':(refS==='analyzing'||refS==='preparing')?'busy':'none';
  return s.rf||'none';
}
function renderSide(){
  const el=document.getElementById('side');
  el.className='side'+((S==='rec'||S==='check')?' dim':'');
  if(!sideOpen){
    const dots=SL.map(s=>{let c='rd';if(s.st==='done')c+=' ok';if(s.st==='short'&&skipShort)c+=' skp';if(s.st==='cur')c+=' cur';return `<div class="${c}" title="Sentence ${s.n}">${s.n}<b class="rf ${rfClass(s)}"></b></div>`}).join('');
    el.innerHTML=`<div class="rail"><button class="sd-tg" onclick="toggleSide()" title="Show sentence list">»</button><div class="rail-c">17<span>of 18</span></div><div class="rail-l">${dots}</div></div>`;
    return;
  }
  const ico={ready:'○',rec:'●',check:'…',none:'○',partial:'◐',full:'✓'}[S];
  const sub={ready:heard?'listened':'not started',rec:'recording…',check:'checking…',none:'tried '+takes.length+'×',partial:'tried '+takes.length+'×',full:'tried '+takes.length+'×'}[S];
  const items=SL.map(s=>{
    let c='si',i='○',m='not started',h=Array(s.w).fill('n'),click=`toast('Jumps to sentence ${s.n}')`;
    if(s.st==='done'){c+=' ok';i='✓';h=s.heat;m='practiced · '+s.takes+' takes';click=`toast('Opens sentence ${s.n} with your last take and the text revealed')`}
    if(s.st==='short'&&skipShort){c+=' skp';i='';m='too short · skipped'}
    if(s.st==='cur'){c+=' cur';if(S==='full')c+=' ok';i=ico;m=sub;click='';if(isRes())h=ATT[S].st}

  }).join('');
  el.innerHTML=`<div class="sd-h"><div class="sd-row"><div class="sd-t">Sentences</div><button class="sd-tg" onclick="toggleSide()" title="Collapse sentence list">«</button></div><div class="sd-s">18 in this segment · 4 done</div><div class="sd-note">No text in this list. Open a practiced sentence to review it.</div><label class="ck"><input type="checkbox" ${skipShort?'checked':''} onchange="skipShort=this.checked;renderSide()"> Skip very short sentences</label></div><div class="sd-l"><div class="earlier">↑ 13 earlier sentences</div>${items}</div><div class="sd-leg"><span><i style="background:#5DCAA5"></i>matched</span><span><i style="background:#EF9F27"></i>different</span><span><i style="background:#E24B4A"></i>skipped</span><span><b class="rf ready"></b>reference ready</span></div>`;
}

/* result view */
function refRow(){
  return `<div class="wf">${REF.map((w,i)=>`<div class="wcd ${FN.has(i)?'fn':''}"><div class="t">${wspan(i,'sm')}</div><div class="bg">${BADGE[i]?`<span class="b ${BADGE[i][0]}">${BL[BADGE[i][0]]}</span>`:''}</div></div>`).join('')}</div>`;
}
function userRow(t){
  const a=ATT[t];
  return `<div class="wf">${REF.map((w,i)=>{
    const s=a.st[i];
    if(s==='x')return `<div class="wcd ghost"><div class="t">${w}</div><div class="ns">skipped</div></div>`;
    if(s==='w')return `<div class="wcd diff"><div class="t">${a.heard[i]}</div><div class="ns">not scored</div></div>`;
    const b=BADGE[i],bad=b&&!b[1];
    return `<div class="wcd ${FN.has(i)?'fn':''} ${bad?'bad':''}"><div class="t">${w}</div><div class="bg">${b?`<span class="b ${b[0]} ${b[1]?'':'no'}">${BL[b[0]]} ${b[1]?'✓':'✗'}</span>`:''}</div></div>`;

}
function stressRow(arr,u){
  return `<div class="srw">${REF.map((w,i)=>`<div class="sw ${FN.has(i)?'fn':''} ${u&&arr[i]!==STRESS[i]?'is':''}"><div class="dd"><i class="${arr[i]===2?'p':'u'}"></i></div><div class="t">${wspan(i,'sm')}</div></div>`).join('')}</div>`;
}
function curve(){
  return `<svg width="100%" height="90" viewBox="0 0 480 90" preserveAspectRatio="none" style="background:var(--color-background-secondary);border-radius:8px;margin-bottom:8px"><polyline points="0,70 40,62 80,48 120,36 160,26 200,22 240,28 280,36 320,40 360,34 400,30 440,40 480,66" fill="none" stroke="#6366F1" stroke-width="2" opacity=".45"/><polyline points="0,72 40,68 80,60 120,54 160,48 200,48 240,52 280,58 320,60 360,58 400,60 440,64 480,70" fill="none" stroke="#E24B4A" stroke-width="2"/></svg>`;
}
function refGate(){
  if(refS==='preparing'||refS==='analyzing')return `<div class="lockp"><div class="t"><span class="spin"></span> Waiting for the reference</div><div class="d">Sound, rhythm and melody are compared against the reference audio. Your word check is already done.</div></div>`;
  return `<div class="lockp"><div class="t">Reference audio needed for this view</div><div class="d">Word matching works without it. To compare sound, rhythm and melody, ${auth==='on'?'prepare this sentence first.':'enable reference audio and prepare this sentence.'}</div><button class="bt p sm" onclick="goPrepare()">${auth==='on'?'Prepare this sentence':auth==='waiting'?'Waiting for the extension icon…':'Enable reference audio'}</button></div>`;
}
function analysisHTML(){
  const refOk=refS==='ready';
  const sc={sound:78,rhythm:86,melody:69};
  const tabsH=[['sound','🔊 Sound'],['rhythm','♩ Rhythm'],['melody','〰 Melody']].map(([k,l])=>{
    let b,lock;
    if(S==='none'){b='<span class="lb">🔒</span>';lock=true}
    else if(!refOk){b=(refS==='analyzing'||refS==='preparing')?'<span class="lb">…</span>':'<span class="lb">🔒</span>';lock=true}
    else if(S==='full'){b=`<span class="lb sc">${sc[k]}</span>`;lock=false}
    else if(k==='sound'){b='<span class="lb sc">71*</span>';lock=false}
    else{b='<span class="lb">🔒</span>';lock=true}
    return `<div class="lt ${tab===k&&!lock?'on':''} ${lock?'lock':''}" data-t="${k}" onclick="setTab('${k}',${lock})">${l}${b}</div>`;
  }).join('');
  const counts={Linking:2,Weak:2,'Flap-T':1};
  const pcs=`<div class="pcs">${['All','Linking','Weak','Flap-T','Elision','Assim.','Glottal','Drop-D','H-drop','Vowel len.','Voicing'].map((x,i)=>{const n=counts[x]||0;return `<div class="pc ${i===0?'on':''} ${i>0&&!n?'dim':''}" onclick="this.parentNode.querySelectorAll('.pc').forEach(e=>e.classList.remove('on'));this.classList.add('on')">${x}${n?' · '+n:''}</div>`}).join('')}</div>`;
  let cont='',fb='';
  if(S==='none'){
    cont=`<div class="nonep"><div class="t">Let's get the words down first</div><div class="d">This take isn't scored. Sound, rhythm and melody are compared once the words line up, otherwise the numbers wouldn't mean anything. Long sentences are the usual cause, so build it from the end.</div><div class="chain"><span class="ch a">robotic learning</span><span class="ar">→</span><span class="ch b">plays a huge role in robotic learning</span><span class="ar">→</span><span class="ch c">the whole sentence</span></div></div>`;
  } else if(!refOk){
    cont=refGate();
  } else if(S==='partial'&&tab!=='sound'){
    cont=`<div class="lockp"><div class="t">${tab==='rhythm'?'Rhythm':'Melody'} unlocks at 85%</div><div class="d">Stress, pauses and pitch can only be compared when nearly every word lines up. You are at ${pct('partial')}%.</div></div>`;
  } else if(tab==='sound'){
    cont=`${pcs}<div class="rl r">Reference</div>${refRow()}<div class="rl u">Your voice${S==='partial'?' · dashed words are not scored':''}</div>${userRow(S)}`;
  } else if(tab==='rhythm'){
    cont=`<div class="rl r">Reference stress</div>${stressRow(STRESS,false)}<div class="rl u">Your stress</div>${stressRow(USTRESS,true)}<div class="nt">The second "so" was over-stressed. It's a function word and should be quick and quiet.</div>`;
  } else {
    cont=`<div class="rl r">Pitch contour</div>${curve()}<div class="nt">The main pitch fall should land on "learning". Yours stays flat until the end.</div>`;
  }
  if(refOk&&(S==='partial'||S==='full')){
    fb=`<div class="fb"><div class="fb-l">Feedback</div>`+(S==='partial'?`
      <div class="fi"><div class="fic bad">✗</div>"clearly" was skipped</div>
      <div class="fi"><div class="fic bad">✗</div>"simulation" heard as "stimulation"</div>
      <div class="fi"><div class="fic bad">✗</div>"robotic": /t/ not flapped</div>
      <div class="fi"><div class="fic ok">✓</div>"plays a" linked, "a" reduced</div>`:`
      <div class="fi"><div class="fic bad">✗</div>Second "so" over-stressed</div>
      <div class="fi"><div class="fic bad">✗</div>"robotic": /t/ not flapped</div>
      <div class="fi"><div class="fic ok">✓</div>"plays a" and "role in" linked</div>
      <div class="fi"><div class="fic ok">✓</div>"a" and "in" reduced</div>`)+`<div class="tip">${S==='partial'?'Say "clearly" before "simulation". It carries the first real stress of the sentence.':'Say "robotic" with a quick tap on the /t/, like the d in "body".'}</div></div>`;
  }
  return `<div class="card"><div class="tabs">${tabsH}</div><div class="rbody"><div class="rcont">${cont}</div>${fb}</div></div>`;
}
function takesHTML(){
  if(!takes.length)return '';
  const chips=takes.map(t=>`<div class="tkc ${sel===t.id?'on':''}" onclick="selTake(${t.id})">Take ${t.id} · ${t.time} · ${{none:'○',partial:'◐',full:'✓'}[t.tier]} ${pct(t.tier)}%<span class="sup">${t.support}</span></div>`).join('');
  return `<div class="card"><div class="tk"><span class="tk-l">Takes</span>${chips}<span class="priv">🔒 Private to you · not used for training</span><span class="del" onclick="delTake()">Delete this take</span></div></div>`;
}
function resultHTML(){
  const p=pct(S);
  const col=S==='full'?'#1D9E75':S==='partial'?'#EF9F27':'#E24B4A';
  const msg=S==='full'?'All 11 words matched':S==='partial'?`${p}% of words matched · Sound scored on the matched words`:`${p}% of words matched · not scored this time`;
  const rvc=justRev?'rv':'';justRev=false;
  let pri,sec2;
  if(playing){pri=`<button class="bt p big dis">${playing==='prepare'?'Preparing…':'♪ Playing…'}</button>`;sec2=''}
  else if(S==='none'){pri=`<button class="bt p big" onclick="act('chunk')">Practice the last part</button>`;sec2=`<button class="bt" onclick="act('slow')">▶ Listen at ${captured()?'0.7':'0.75'}×</button><button class="bt" onclick="act('keywords')">Try with key words</button><button class="bt" onclick="act('mine')">▶ My take</button>`}
  else if(S==='partial'){pri=`<button class="bt p big" onclick="act('record')">● Try again</button>`;sec2=`<button class="bt" onclick="act('mine')">▶ My take</button><button class="bt" onclick="act('next')">Next sentence →</button>`}
  else{pri=`<button class="bt p big" onclick="act('next')">Next sentence →</button>`;sec2=`<button class="bt" onclick="act('record')">● Record again</button><button class="bt" onclick="act('mine')">▶ My take</button>`}
  return navRow()+playerHTML()+`<div class="fx" style="padding-top:10px"><div class="fx-text ${rvc}">${diffRow()}</div><div class="stat"><i style="background:${col}"></i>${msg}${S!=='full'?'<span class="lnk" onclick="toast(\'Marked as read correctly. Thanks.\')">I said it correctly</span>':''}</div><div class="acts">${pri}</div>${sec2?`<div class="acts">${sec2}</div>`:''}${playing?'':`<div class="lk-row">${setPill()}</div>`}</div>`+analysisHTML()+takesHTML();
}

/* render */
function normSpd(){if(!SPEEDS().includes(spd))spd=1}
function renderMain(){normSpd();document.getElementById('main').innerHTML=`<div class="inner">${isRes()?resultHTML():focusHTML()}</div>`}
function renderAll(){document.getElementById('grid').className='grid'+(sideOpen?'':' col');renderBar();renderSide();renderMain()}
function setTab(k,lock){if(lock||S==='none')return;tab=k;renderMain()}
function setTl(i){tl=i;rev.clear();renderAll()}
function togglePop(n){pop=pop===n?null:n;renderMain()}
function selTake(id){const t=takes.find(x=>x.id===id);sel=id;S=t.tier;tab='sound';renderAll()}
function delTake(){takes=takes.filter(t=>t.id!==sel);if(!takes.length){S='ready';sel=null}else{const l=takes[takes.length-1];sel=l.id;S=l.tier}tab='sound';renderAll();toast('Take deleted')}

/* reference audio flow */
function enableRef(){auth='waiting';renderAll()}
function cancelEnable(){auth='off';renderAll()}
function goPrepare(){if(auth==='on')prepareSentence();else if(auth==='off')enableRef()}
function delRef(){clearTimeout(rt);refS='none';pop=null;renderAll();toast('Captured reference deleted')}
function prepareSentence(){
  if(auth!=='on'||playing||refS!=='none')return;
  refS='preparing';
  startPlay('prepare',()=>{
    refS='analyzing';renderAll();
    clearTimeout(rt);rt=setTimeout(()=>{if(refS==='analyzing'){refS='ready';renderAll()}},2400);
  });
}

/* playback (listen / prepare) */
function litIdx(i){document.querySelectorAll('#main [data-i]').forEach(e=>e.classList.toggle('lit',+e.dataset.i===i))}
function startPlay(kind,then){
  if(playing)return;
  playing=kind;prog=0;pop=null;renderAll();
  const dur=kind==='prepare'?3200:Math.round(2600/spd);
  const t0=performance.now();
  clearInterval(pt);
  pt=setInterval(()=>{
    prog=Math.min(1,(performance.now()-t0)/dur);
    const f=document.getElementById('vfill');if(f)f.style.width=(prog*100)+'%';
    const m=document.getElementById('mfill');if(m)m.style.width=(prog*100)+'%';
    const tm=document.getElementById('vtime');if(tm)tm.textContent='21:'+String(21+Math.round(prog*5)).padStart(2,'0')+' / ~21:26';
    litIdx(Math.min(REF.length-1,Math.floor(prog*REF.length)));
    if(prog>=1){clearInterval(pt);litIdx(-1);playing=false;prog=0;heard=true;if(then)then();else renderAll()}
  },60);
}

/* recording */
function startRec(){
  clearInterval(tmr);clearInterval(pt);playing=false;
  S='rec';secs=0;pop=null;tab='sound';
  tmr=setInterval(()=>{secs++;const e=document.getElementById('tm');if(e)e.textContent='0:0'+Math.min(secs,9)},1000);
  renderAll();
}
function stopRec(){
  clearInterval(tmr);
  const tier=OUT[Math.min(takes.length,2)],id=takes.length+1;
  const sup=tl===1?'key words':tl===2?'full text':(rev.size?'peeked '+rev.size:'text hidden');
  takes.push(mk(id,tier,sup));sel=id;rev.clear();
  S='check';renderAll();
  setTimeout(()=>{if(S==='check'){S=tier;justRev=true;renderAll()}},1500);
}
function act(a){
  if(playing)return;
  if(a==='lr'){ensureMic(()=>startPlay('listen',()=>startRec()));return}
  if(a==='listen'){if(S==='ready')startPlay('listen');else toast('Playing the sentence at '+spd+'×…');return}
  if(a==='record'){ensureMic(startRec);return}
  if(a==='stop'){stopRec();return}
  if(a==='keywords'){tl=1;S='ready';heard=true;rev.clear();renderAll();toast('Key words shown for your next take');return}
  const m={slow:'Playing slowly…',mine:'Playing your take…',chunk:'Starting with the last 2 words, text hidden…',next:'Next sentence. Very short ones are skipped.'};
  toast(m[a]||'');
}

/* demo controls */
function syncDemo(){
  document.querySelectorAll('.demo button[data-s]').forEach(b=>b.classList.toggle('on',b.dataset.s===(S==='ready'&&heard?'heard':S)));
  const rk=refS==='ready'?'ready':refS==='analyzing'?'analyzing':refS==='preparing'?'preparing':auth==='waiting'?'waiting':auth==='on'?'none':'off';
  document.querySelectorAll('.demo button[data-r]').forEach(b=>b.classList.toggle('on',b.dataset.r===rk));
  document.querySelectorAll('.demo button[data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m===mic));
}
function jump(s){
  clearInterval(tmr);clearInterval(pt);playing=false;prog=0;tab='sound';tl=0;rev.clear();pop=null;takes=[];sel=null;
  S=s==='heard'?'ready':s;
  heard=(s!=='ready');
  if(s==='none'){takes=[mk(1,'none','text hidden')];sel=1}
  if(s==='partial'){takes=[mk(1,'none','text hidden'),mk(2,'partial','peeked 2')];sel=2}
  if(s==='full'){takes=[mk(1,'none','text hidden'),mk(2,'partial','peeked 2'),mk(3,'full','text hidden')];sel=3}
  renderAll();syncDemo();
}
function setRef(k){
  clearInterval(pt);clearTimeout(rt);playing=false;prog=0;vidForce=null;pop=null;
  if(k==='off'){auth='off';refS='none'}
  if(k==='waiting'){auth='waiting';refS='none'}
  if(k==='none'){auth='on';refS='none'}
  if(k==='analyzing'){auth='on';refS='analyzing'}
  if(k==='ready'){auth='on';refS='ready'}
  if(k==='preparing'){auth='on';refS='none';renderAll();syncDemo();prepareSentence();syncDemo();return}
  renderAll();syncDemo();
}
document.querySelectorAll('.demo button[data-s]').forEach(b=>b.onclick=()=>jump(b.dataset.s));
document.querySelectorAll('.demo button[data-r]').forEach(b=>b.onclick=()=>setRef(b.dataset.r));
document.querySelectorAll('.demo button[data-m]').forEach(b=>b.onclick=()=>{mic=b.dataset.m;micPrompt=false;renderBar();syncDemo()});
